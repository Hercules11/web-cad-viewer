# 构建 Web CAD Viewer 并部署到 GitHub Pages
name: Deploy to GitHub Pages

on:
  # 推送到默认分支时触发
  push:
    branches: ["main"]
  # 允许在 Actions 页手动触发
  workflow_dispatch:

# GITHUB_TOKEN 权限: 拉取代码 + 发布 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署, 排队的部署会被最新的一次取代
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 版本从 package.json 的 packageManager 字段读取

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check & build
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 首次部署时自动启用 Pages
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
